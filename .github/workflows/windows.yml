name: windows

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build
        run: flutter build windows --release

      - name: Pack
        shell: pwsh
        run: >
          Compress-Archive -Path build/windows/x64/runner/Release/*
          -DestinationPath shijianxian-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: shijianxian-windows
          path: shijianxian-windows.zip
          retention-days: 30
