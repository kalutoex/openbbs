name: ios

# 出未签名的 ipa，拿到手自己用 AltStore / Sideloadly 签。
# 签名要证书和 provisioning profile，这里不碰，--no-codesign 跳过。

on:
  push:
    branches: [master, main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pub get
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter pub get

      - name: Pod install 前置（首次构建由 Flutter 生成 Podfile）
        run: |
          cd ios
          pod repo update || true

      - name: Build（不签名）
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter build ios --release --no-codesign

      - name: 打 ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry OpenBBS-unsigned.ipa Payload
          ls -lh OpenBBS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBBS-unsigned-ipa
          path: build/ios/iphoneos/OpenBBS-unsigned.ipa
          retention-days: 30
