<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}论坛{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">论坛</a>
  <nav>
    {% if user %}
      <a href="/new">发帖</a>
      <span class="who">{{ user.name }}</span>
      <a href="/logout">退出</a>
    {% else %}
      <a href="/login">登录</a>
      <a href="/register">注册</a>
    {% endif %}
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
