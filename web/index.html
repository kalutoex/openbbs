<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="一个能自己部署的轻论坛">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111F1B">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpenBBS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OpenBBS</title>
  <script>
    // 清掉旧版 service worker 和缓存：曾注册过的 SW 会一直供旧文件，导致页面停在老版本。
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (ks) {
        ks.forEach(function (k) { caches.delete(k); });
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">

  <!-- 首帧之前的等待画面。引擎初始化要下载几 MB，空着是一片白。 -->
  <style>
    html, body { margin: 0; height: 100%; }
    #boot {
      position: fixed; inset: 0; z-index: 9;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #fff; color: #666;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity .25s ease;
    }
    @media (prefers-color-scheme: dark) { #boot { background: #121212; color: #999; } }
    #boot .name { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
    #boot .bar { width: 120px; height: 2px; border-radius: 2px; background: currentColor; opacity: .15; overflow: hidden; position: relative; }
    #boot .bar::after { content: ""; position: absolute; left: -40%; top: 0; width: 40%; height: 100%; background: currentColor; opacity: .9; animation: boot-slide 1.1s ease-in-out infinite; }
    @keyframes boot-slide { to { left: 100%; } }
  </style>
</head>
<body>
  <div id="boot"><div class="name">OpenBBS</div><div class="bar"></div></div>
  <script>
    // 首帧画出来就把等待画面淡出移除；万一事件没来，10 秒后也清掉。
    (function () {
      function clearBoot() {
        var b = document.getElementById('boot');
        if (!b) return;
        b.style.opacity = '0';
        setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 260);
      }
      window.addEventListener('flutter-first-frame', clearBoot);
      setTimeout(clearBoot, 10000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
